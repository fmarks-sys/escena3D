<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escena 3D Pesada con Compresión Draco</title>
    
    <!-- Importa el visor 3D de Google (Soporta Draco automáticamente) -->
    <script type="module" src="https://googleapis.com"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #111111;
            font-family: sans-serif;
            overflow: hidden;
        }
        /* Contenedor del modelo interactivo */
        model-viewer {
            width: 100%;
            height: 100%;
            --poster-color: transparent;
        }
        /* Pantalla de carga personalizada mientras se descomprime el archivo */
        #preload-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #09f;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <!-- Pantalla de carga activa mientras Draco procesa los datos -->
    <div id="preload-overlay">
        <div class="spinner"></div>
        <p>Descomprimiendo escena pesada con Draco...</p>
    </div>

    <!-- Visor 3D principal -->
    <model-viewer 
        id="escena3d"
        src="lapida.glb" 
        camera-controls 
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        interaction-prompt="auto"
        touch-action="pan-y">
    </model-viewer>

    <script>
        // Oculta la pantalla de carga cuando el modelo Draco se ha procesado por completo
        const viewer = document.querySelector('#escena3d');
        const overlay = document.querySelector('#preload-overlay');
        
        viewer.addEventListener('load', () => {
            overlay.classList.add('hidden');
        });
    </script>

</body>
</html>
