<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Escena 3D</title>

    <!-- Model Viewer -->
    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #111;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        model-viewer {
            width: 100vw;
            height: 100dvh;
            background: #111;
            --poster-color: transparent;
        }

        #preload-overlay {
            position: fixed;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background: #111;
            color: white;

            z-index: 10;

            transition:
                opacity 0.5s ease,
                visibility 0.5s ease;
        }

        #preload-overlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .spinner {
            width: 50px;
            height: 50px;

            border: 4px solid rgba(255, 255, 255, 0.15);
            border-left-color: #0099ff;
            border-radius: 50%;

            animation: spin 1s linear infinite;

            margin-bottom: 20px;
        }

        #mensaje {
            font-size: 15px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div id="preload-overlay">
        <div class="spinner"></div>
        <p id="mensaje">Cargando escena 3D...</p>
    </div>

    <model-viewer
        id="escena3d"

        src="./lapida.glb"

        camera-controls
        auto-rotate
        auto-rotate-delay="1000"

        shadow-intensity="1"
        exposure="1"

        interaction-prompt="auto"
        touch-action="pan-y"

        alt="Modelo 3D">

    </model-viewer>

    <script>
        const viewer = document.querySelector("#escena3d");
        const overlay = document.querySelector("#preload-overlay");
        const mensaje = document.querySelector("#mensaje");

        // Modelo cargado correctamente
        viewer.addEventListener("load", () => {
            overlay.classList.add("hidden");
        });

        // Error al cargar el GLB
        viewer.addEventListener("error", (event) => {
            console.error("Error cargando modelo 3D:", event);

            mensaje.textContent =
                "No se pudo cargar el modelo 3D.";

            setTimeout(() => {
                overlay.classList.add("hidden");
            }, 3000);
        });

        // Seguridad por si ocurre algún problema
        setTimeout(() => {
            overlay.classList.add("hidden");
        }, 15000);
    </script>

</body>
</html>
